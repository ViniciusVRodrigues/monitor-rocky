<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rocky · monitor</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<header class="topo">
  <h1 class="topo-titulo">Rocky</h1>
  <span id="chip" class="chip chip-desconhecido" data-estado="desconhecido"><span class="chip-icone" aria-hidden="true">?</span><span id="chip-texto">Estado desconhecido</span></span>
  <button type="button" id="ouvir-mini" class="botao botao-mini" hidden><span class="rotulo">Ouvir</span></button>
  <span id="conexao" class="conexao">Conectando…</span>
</header>
<div id="faixa-offline" class="faixa-offline" role="status" hidden>Sem conexão com o monitor no PC. Tentando de novo…</div>
<div id="faixa-voltou" class="faixa-voltou" role="status" hidden>Conectado de novo</div>
<p id="anuncio" class="so-leitor" aria-live="polite"></p>

<main class="pagina">
  <section class="ao-vivo" aria-labelledby="t-aovivo">
    <h2 id="t-aovivo" class="so-leitor">Ao vivo</h2>
    <div id="player" class="player">
      <div id="faixa-gravacao" class="faixa-gravacao" hidden>
        <span id="faixa-gravacao-texto">Gravação</span>
        <button type="button" id="btn-voltar-vivo" class="botao botao-claro">Voltar ao ao vivo</button>
      </div>
      <video id="video" class="video" muted playsinline></video>
      <span id="nivel" class="nivel" data-estado="sem-som"><span class="nivel-rotulo">Som</span><span id="nivel-barra" class="nivel-barra" aria-hidden="true"><span id="nivel-preench" class="nivel-preench"></span></span><span id="nivel-texto" class="nivel-texto">Sem som</span></span>
      <span id="selo" class="selo" hidden>AO VIVO · cerca de 8 s atrás</span>
      <div id="tela" class="tela" hidden>
        <div id="medidor" class="medidor" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p id="tela-texto" class="tela-texto"></p>
        <button type="button" id="tela-botao" class="botao botao-principal" hidden></button>
      </div>
    </div>
  </section>

  <section class="controles" aria-labelledby="t-controles">
    <h2 id="t-controles" class="so-leitor">Controles</h2>
    <button type="button" id="btn-ouvir" class="botao botao-principal botao-ouvir">
      <svg class="icone" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="gira" aria-hidden="true"></span>
      <span class="rotulo">Ativar som</span>
    </button>
    <div class="grade-controles">
      <button type="button" id="btn-camera" class="botao" data-controle><span class="gira" aria-hidden="true"></span><span class="rotulo">Liberar câmera</span></button>
      <button type="button" id="btn-ouvirpc" class="botao" data-controle aria-pressed="false"><span class="gira" aria-hidden="true"></span><span class="rotulo">Ouvir no PC</span><span class="sub" id="sub-ouvirpc"></span></button>
      <button type="button" id="btn-gravacao" class="botao botao-perigo" data-controle><span class="gira" aria-hidden="true"></span><span class="rotulo">Parar</span></button>
      <div id="confirma-parar" class="confirma" role="group" aria-label="Confirmar parada" hidden>
        <span class="confirma-texto">Parar a gravação?</span>
        <button type="button" id="btn-sim-parar" class="botao botao-perigo">Sim, parar</button>
        <button type="button" id="btn-cancelar-parar" class="botao">Cancelar</button>
      </div>
    </div>
    <p id="aviso-offline" class="aviso-offline" hidden>Controles indisponíveis sem conexão.</p>
    <p id="aviso-controle" class="aviso-erro" role="alert" hidden><span id="aviso-controle-texto"></span> <button type="button" id="btn-tentar-controle" class="botao botao-link">Tentar de novo</button></p>
  </section>

  <section class="dia" aria-labelledby="t-dia">
    <h2 id="t-dia" class="so-leitor">Linha do tempo</h2>
    <div class="dia-modo" role="group" aria-label="O que mostrar">
      <button type="button" id="modo-linha" class="botao" aria-pressed="true">Linha do tempo</button>
      <button type="button" id="modo-guardados" class="botao" aria-pressed="false">Guardados</button>
    </div>
    <nav class="dia-nav" aria-label="Escolher o dia">
      <button type="button" id="dia-anterior" class="botao">‹ Dia anterior</button>
      <span class="dia-nav-meio"><span id="dia-rotulo" class="dia-rotulo">Hoje</span><button type="button" id="dia-hoje" class="botao botao-link" hidden>Ir para hoje</button></span>
      <button type="button" id="dia-proximo" class="botao">Próximo dia ›</button>
    </nav>
    <div id="regua" class="regua" aria-hidden="true"></div>
    <div id="regua-horas" class="regua-horas" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div id="pilula-area" class="pilula-area" aria-live="polite"><button type="button" id="pilula" class="botao botao-pilula" hidden></button></div>
    <div id="lista" class="lista" aria-busy="false"></div>
    <div id="guardados" class="lista" aria-busy="false" hidden></div>
  </section>
</main>

<script src="/vendor/hls.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
